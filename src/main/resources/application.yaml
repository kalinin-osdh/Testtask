server:
  port: 8080

spring:
  application:
    name: testtask

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: kalinin.130275
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
